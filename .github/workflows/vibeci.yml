name: VibeCI

on:
  pull_request:

permissions: {}

concurrency:
  group: vibeci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vibeci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write # effective on same-repo PRs only; fork PRs get annotations + job summary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
